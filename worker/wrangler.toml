name = "wake-or-pay-discord"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# The Discord application's client ID. Public — it is in the authorize URL the
# browser opens, and it is in the app's source too.
DISCORD_CLIENT_ID = "1542696296337506415"

# Browser origins allowed to POST here, comma separated. Left empty on
# purpose: only the Android app calls this, and a native app sends no Origin
# header at all. Anything that *does* send one is a web page, and a web page
# has no business spending this Worker's client secret.
ALLOWED_ORIGINS = ""

# The SHA-256 fingerprint of the certificate the APK is signed with, published
# in /.well-known/assetlinks.json so Android will hand
# https://…/discord/callback straight to the app instead of a browser tab.
#
# Public by nature — it is the fingerprint of a public certificate, and the
# whole point is that it is served to anybody who asks. This is the **debug**
# keystore (%USERPROFILE%\.android\debug.keystore), because
# android/app/build.gradle.kts still signs release with it. Swap in a release
# keystore and this line has to change in the same commit, or app-link
# verification fails and the callback lands in a browser.
#
#   keytool -list -v -keystore %USERPROFILE%\.android\debug.keystore \
#           -alias androiddebugkey -storepass android
ANDROID_CERT_SHA256 = "11:3E:06:2F:19:63:A2:10:E1:AD:53:CE:73:E6:EF:02:D6:60:6F:AD:B6:01:EF:7F:C9:79:8E:1A:D0:78:BC:61"

# Stripe の公開可能キー。**公開情報**です——同じ値が APK にも埋まっていて、
# ブラウザや PaymentSheet に出ていきます。ここに置いてよい唯一の Stripe の値。
# /v1/billing/setup-intent がこれをそのまま返すのは、アプリが自分のビルド時定数と
# 食い違っていないかを確かめられるようにするためです。
STRIPE_PUBLISHABLE_KEY = "pk_test_51U9duQAPhpIXWYKDgizN5lwnK7vYTYCxkobH8c5VoTkU1H8Moz0hYepyusCWWjvwJx3dYVGDGAw6zTqFWpAANuzM00EWieWdwT"

# 端末・同意・カードのメタデータ（brand/last4/期限だけ）を置く D1。
# カード番号は入りません——それは Stripe の PaymentMethod に留まります。
#
# **database_id は自分で作って貼ること。**
#
#   wrangler d1 create wake-or-pay-billing
#
# が出力する `database_id = "…"` を下の REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT と
# 差し替えてから、
#
#   wrangler d1 migrations apply wake-or-pay-billing --remote
#
# でスキーマ（migrations/0001_billing.sql）を流します。
[[d1_databases]]
binding = "DB"
database_name = "wake-or-pay-billing"
database_id = "3513fb56-ab92-4a96-ade8-bfe896b56a76"

# シークレットはこのファイルに **1 つも** ありませんし、置いてはいけません。
# ここに書いたものはリポジトリのすべてのコピーに入ります。
#
#   wrangler secret put DISCORD_CLIENT_SECRET
#   wrangler secret put STRIPE_SECRET_KEY       # sk_test_… / sk_live_…
#   wrangler secret put STRIPE_WEBHOOK_SECRET   # whsec_…（Stripe ダッシュボード）
#
# `wrangler secret put` で入れた値は Cloudflare 側に暗号化されて置かれ、
# `wrangler deploy` してもファイルには残りません。
