name: wake_or_pay
description: "Wake or Pay — 覚悟の目覚まし。寝坊するほど、知らないおじさんが儲かる目覚まし。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0
  alarm: ^5.12.0
  shared_preferences: ^2.5.5
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^12.0.1
  wakelock_plus: ^1.7.0
  sensors_plus: ^7.1.0
  file_picker: ^12.1.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
