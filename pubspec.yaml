name: wake_or_pay
description: "Wake or Pay — 覚悟の目覚まし。寝坊するほど、知らないおじさんが儲かる目覚まし。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0
  alarm: ^5.12.0
  shared_preferences: ^2.5.5
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^12.0.1
  wakelock_plus: ^1.7.0
  sensors_plus: ^7.1.0
  file_picker: ^12.1.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  record: ^7.1.1
  http: ^1.2.0
  # Discord OAuth2（段階F）。開く側と戻る側の 2 つに分かれている。
  #
  # **開く側は url_launcher。** `LaunchMode.externalNonBrowserApplication` は
  # ブラウザ以外にしか渡らないので、Discord アプリが入っていればそこに解決し、
  # 入っていなければ false／例外になる。そこでブラウザに落とす。
  #
  # **戻る側は app_links。** `wakeorpay://` の intent を MainActivity 自身が
  # 受け取る（`launchMode=singleTask` ＋ scheme の intent-filter）ので、
  # コールバックが来た瞬間にアプリのタスクが前に出る。
  # flutter_web_auth_2 をやめた理由がまさにここ：あちらの CallbackActivity は
  # 別タスクに落ちるため、Dart の future は解決するのに画面は Custom Tab の
  # まま——「承認したのに何も起きない」の正体だった（README の「根本原因」）。
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  # 段階D。SMTP 送信と、そのアプリパスワードの保管先。
  mailer: ^7.2.0
  flutter_secure_storage: ^11.0.0
  android_alarm_manager_plus: ^5.1.1
  # SMS 送信と電話発信の Android 側。app 内のローカルプラグイン。
  wop_platform:
    path: packages/wop_platform
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    # Discord マーク（Simple Icons・CC0-1.0）。出典は assets/icons/LICENSE.md。
    - assets/icons/

  # M PLUS Rounded 1c — SIL Open Font License 1.1.
  # 全文は assets/fonts/OFL.txt、経緯は assets/fonts/LICENSE.md にあります。
  fonts:
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
